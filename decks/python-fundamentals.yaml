id: python-fundamentals
title: "Python — fondamentaux"
cards:
  - id: python-fundamentals-gil
    question: |
      Qu'est-ce que le GIL, et quelle est sa conséquence pour le
      multithreading CPU-bound en CPython ?
    reference_answer: |
      Le GIL est un verrou qui n'autorise qu'un seul thread à exécuter du
      bytecode Python à la fois dans un même interpréteur. Conséquence : les
      threads ne parallélisent pas le code CPU-bound ; ils restent utiles pour
      l'I/O-bound.
    grading_rubric:
      - "Un seul thread exécute du bytecode à la fois"
      - "Pas de parallélisme CPU-bound, utile pour l'I/O-bound"
    source_anchor: "docs.python.org/3/glossary.html#term-global-interpreter-lock"
    explanation: |
      Le GIL est un verrou unique qui protège l'état interne de CPython. Un
      seul thread exécute du bytecode à la fois, donc le multithreading
      n'accélère pas le calcul (CPU-bound). Pour de l'I/O (réseau, disque),
      les threads restent utiles car le verrou est relâché pendant l'attente.
      Pour paralléliser du calcul, on passe par multiprocessing.

  - id: python-fundamentals-new-vs-init
    question: "Quelle est la différence entre `__new__` et `__init__` ?"
    reference_answer: |
      `__new__` crée et retourne la nouvelle instance (le vrai constructeur).
      `__init__` initialise l'instance déjà créée et ne retourne rien (None).
    grading_rubric:
      - "`__new__` crée et retourne l'instance"
      - "`__init__` initialise et retourne None"
    source_anchor: "docs.python.org/3/reference/datamodel.html#object.__new__"
    explanation: |
      La création d'un objet se fait en deux temps : __new__ (méthode de
      classe) alloue et retourne l'instance — c'est le vrai constructeur ;
      __init__ initialise ensuite cette instance déjà créée et ne retourne
      rien (None). On surcharge __new__ rarement : immutables, singletons,
      sous-classes de types natifs.

  - id: python-fundamentals-hashable-keys
    question: |
      Pourquoi une liste ne peut-elle pas servir de clé de dictionnaire,
      alors qu'un tuple le peut ?
    reference_answer: |
      Une clé doit être hashable : son hash ne doit jamais changer pendant sa
      durée de vie. Les listes sont mutables, donc non hashables. Un tuple est
      hashable à condition de ne contenir que des éléments eux-mêmes hashables.
    grading_rubric:
      - "Une clé doit être hashable (hash stable)"
      - "Mutable = non hashable (liste), immuable = hashable (tuple)"
      - "Nuance : tuple non hashable s'il contient un élément mutable"
    source_anchor: "docs.python.org/3/glossary.html#term-hashable"
    explanation: |
      Un dict repose sur une table de hachage : il hache la clé pour retrouver
      la valeur. Si une clé pouvait changer (comme une liste modifiée), son
      hash changerait et la valeur deviendrait introuvable. Une clé doit donc
      être hashable, donc immuable. Un tuple est immuable, donc hashable —
      sauf s'il contient un élément mutable comme une liste.

  - id: python-fundamentals-is-vs-eq
    question: "Quelle est la différence entre `is` et `==` ?"
    reference_answer: |
      `==` compare les valeurs (égalité), `is` compare l'identité des objets
      (même objet en mémoire).
    grading_rubric:
      - "`==` compare les valeurs"
      - "`is` compare l'identité (même objet)"
    source_anchor: "docs.python.org/3/reference/expressions.html#is"
    explanation: |
      == appelle __eq__ et compare les valeurs (le contenu). is compare les
      identités : vrai seulement si les deux noms désignent le même objet en
      mémoire. CPython interne certains petits entiers et chaînes, donc is
      peut être vrai « par accident » pour eux — ne jamais l'utiliser pour
      comparer des valeurs.

  - id: python-fundamentals-mutable-default
    question: "Pourquoi `def f(x=[])` est-il un piège ?"
    reference_answer: |
      La valeur par défaut est évaluée une seule fois, à la définition de la
      fonction, pas à chaque appel. La même liste est donc partagée entre tous
      les appels et les mutations persistent d'un appel à l'autre.
    grading_rubric:
      - "Évaluée une seule fois, à la définition"
      - "Objet partagé entre appels → mutations persistantes"
    source_anchor: "docs.python.org/3/tutorial/controlflow.html#default-argument-values"
    explanation: |
      Les valeurs par défaut sont évaluées une seule fois, à la définition de
      la fonction, puis réutilisées à chaque appel. Avec une liste, tous les
      appels partagent le même objet : une mutation dans un appel persiste au
      suivant. La parade : mettre None par défaut et créer la liste dans le
      corps de la fonction.
