{% extends "base.html" %}
{% block content %}
<h2>{{ deck.title }}</h2>
{% if card %}
  <div class="card">
    <p class="question">{{ card.question }}</p>
  </div>
  <form method="post" action="/deck/{{ deck.id }}/answer">
    <input type="hidden" name="card_id" value="{{ card.id }}">
    <input type="hidden" name="cram" value="{{ cram }}">
    <label for="answer">Votre réponse :</label>
    <textarea id="answer" name="answer" rows="4" autofocus></textarea>
    <p class="muted hint">Ctrl+Entrée pour valider</p>
    <button type="submit">Valider</button>
  </form>
{% else %}
  <p>🎉 Rien à réviser pour le moment.</p>
  <p><a href="/">← Retour aux decks</a></p>
{% endif %}
{% endblock %}
